<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Background, Message, and Hidden Audio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>🎥 วิดีโอของคุณ 🎥</h2>

    <video controls>
        <source src="videos/my-video.mp4" type="video/mp4">
        <source src="videos/my-video.webm" type="video/webm">
        Your browser does not support the video tag.
    </video>

    <h3 id="message">Loading...</h3>

    <h1>สิ่งสุดท้ายที่อยากจะให้</h1>
    <h3>ของขวัญชิ้นสุดท้าย</h3>
    
    <div class="message" id="randomMessage">😊 ยินดีที่ได้เจอนะ 😊</div>

    <!-- ซ่อนปุ่มเล่นเพลง -->
    <audio autoplay loop>
        <source src="audio/Billkin-Ever-Forever.mp3" type="audio/mp3">
    </audio>

    <script>
        // รูปภาพพื้นหลังแบบสุ่มจากโฟลเดอร์ images
        const backgrounds = [
            'images/100.jpg'
           
        ];

        // ข้อความสุ่ม
        const messages = [
            "จงเชื่อมั่นในตัวเอง เพราะเรามีศักยภาพมากกว่าที่คิด 💪💙",
            "เส้นทางข้างหน้าอาจไม่ง่าย แต่ทุกก้าวที่กล้าก้าวคือชัยชนะของตัวเอง 🚀🔥",
            "อย่ากลัวการเปลี่ยนแปลง เพราะนั่นคือจุดเริ่มต้นของสิ่งที่ยิ่งใหญ่กว่าเดิม 🌱🌤",
            "ความพยายามในวันนี้ จะกลายเป็นพลังที่ผลักดันเธอสู่อนาคต 💡🏆",
            "อย่าลืมความฝัน อย่าลืมความตั้งใจ และอย่าลืมตัวเองในวันที่เดินไปไกล 💖🛤",
            "ทุกก้าวที่เดินไปคือโอกาสใหม่ ขอให้มั่นใจและกล้าฝันต่อไปอย่างเต็มที่ 🌟✨",
            "แม้เส้นทางจะต่างกัน แต่ความทรงจำดี ๆ จะอยู่กับเราเสมอ ⏳💫",
            "จงเป็นตัวเองในเวอร์ชันที่ดีที่สุด และก้าวไปข้างหน้าอย่างภาคภูมิใจ 🌟💙",
            "จบจากที่นี่ แต่ไม่ได้จบจากความฝัน ขอให้เดินต่อไปด้วยใจที่แข็งแกร่ง 🛤✨",
            "ความสำเร็จไม่ได้อยู่ที่จุดหมาย แต่อยู่ที่การไม่ยอมแพ้ระหว่างทาง 🚀🌟"
        ];

        // เมื่อโหลดหน้าเว็บให้สุ่มพื้นหลังและข้อความ
        window.onload = function() {
            const randomBg = backgrounds[Math.floor(Math.random() * backgrounds.length)];
            document.body.style.backgroundImage = `url('${randomBg}')`;

            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById("randomMessage").innerText = messages[randomIndex];
        };
    </script>
</body>
</html>
